<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060B" />
    <meta name="color-scheme" content="dark light" />
    <title>Daily Jobs Dashboard</title>
    <script>
      // Apply a saved Light/Dark choice before first paint so the page never
      // flashes the wrong appearance. With no choice saved, the CSS follows
      // the system setting on its own.
      try {
        var t = localStorage.getItem('hub-dashboard-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      /* Placeholder colors until the app stylesheet loads (see ui/apple.jsx) */
      html { background: #05060B; color: #fff; color-scheme: dark; }
      @media (prefers-color-scheme: light) { html:not([data-theme="dark"]) { background: #EDF0F7; color: #0B0C10; color-scheme: light; } }
      html[data-theme="light"] { background: #EDF0F7; color: #0B0C10; color-scheme: light; }
      body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
